<!DOCTYPE html>
<html>
<head>
  <title>Azure Cloud App</title>
</head>
<body>
  <h1>Frontend on Azure App Service</h1>
  <button onclick="callApi()">Call Backend</button>
  <p id="output"></p>

  <script>
    async function callApi() {
      const res = await fetch("https://BACKEND_APP_NAME.azurewebsites.net/api/hello");
      const data = await res.json();
      document.getElementById("output").innerText =
        data.message + " | DB Time: " + data.time;
    }
  </script>
</body>
</html>
