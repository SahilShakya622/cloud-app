<!DOCTYPE html>
<html>
<body>
  <h1>Frontend on Azure</h1>
  <button onclick="callApi()">Call Backend</button>
  <p id="out"></p>

  <script>
    async function callApi() {
      const res = await fetch("https://BACKEND_APP_NAME.azurewebsites.net/api/hello");
      const data = await res.json();
      document.getElementById("out").innerText = data.message + " | " + data.db_time;
    }
  </script>
</body>
</html>
