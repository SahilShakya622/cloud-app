<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Azure Cloud App</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(-45deg, #0078d4, #00b4d8, #6a11cb, #2575fc);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 420px;
      padding: 35px 40px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      margin: 10px 0 25px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      background: rgba(0, 255, 135, 0.2);
      color: #00ff87;
      border: 1px solid rgba(0, 255, 135, 0.5);
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #00ff87, #0078d4);
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.5);
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(0, 255, 135, 0.8);
    }

    .output {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 14px;
      white-space: pre-line;
      min-height: 60px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Azure Cloud App</h1>
    <div class="badge">LIVE</div>

    <div class="subtitle">
      Frontend on Azure App Service<br />
      Backend API + PostgreSQL Database
    </div>

    <button onclick="callApi()">🚀 Call Backend</button>

    <div id="out" class="output">
      Waiting for backend response...
    </div>

    <div class="footer">
      Built with Terraform & GitHub Actions
    </div>
  </div>

  <script>
    async function callApi() {
      const out = document.getElementById("out");
      out.innerText = "⏳ Fetching data from backend...";

      try {
        const res = await fetch(
          "https://backend-sahil-123.azurewebsites.net/api/hello"
        );
        const data = await res.json();

        out.innerText =
          "✅ Backend Response\n\n" +
          "Message: " + data.message + "\n" +
          "DB Time: " + data.db_time;

      } catch (err) {
        out.innerText = "❌ Failed to connect to backend";
      }
    }
  </script>
</body>
</html>
