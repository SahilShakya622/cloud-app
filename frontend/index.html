<!DOCTYPE html>
<html>
<body>
  <h1>Frontend on Azure</h1>
  <button onclick="callApi()">Call Backend</button>
  <p id="out"></p>

  <script>
    async function callApi() {
      try {
        const res = await fetch(
          "https://backend-sahil-123.azurewebsites.net/api/hello"
        );
        const data = await res.json();
        document.getElementById("out").innerText =
          data.message + " | " + data.db_time;
      } catch (err) {
        document.getElementById("out").innerText =
          "Error calling backend";
      }
    }
  </script>
</body>
</html>
